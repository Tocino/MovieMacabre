
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: moviemacabre-backend

    ports:
      - "8000:8000"

    environment:
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: sqlite:////data/movies.db

    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}

    container_name: moviemacabre-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend