
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: moviemacabre-backend

    restart: unless-stopped

    environment:
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: sqlite:////data/movies.db

    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}

    container_name: moviemacabre-frontend

    restart: unless-stopped

    depends_on:
      - backend

  caddy:
    image: caddy:2

    container_name: moviemacabre-caddy

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config: