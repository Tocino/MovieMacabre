---
- name: Configure MovieMacabre server
  hosts: moviemacabre
  become: true

  vars_files:
    - vault.yml

  tasks:

    - name: Clone or update MovieMacabre repository
      ansible.builtin.git:
        repo: git@github.com:Tocino/MovieMacabre.git
        dest: /home/ubuntu/MovieMacabre
        version: main
        accept_hostkey: true
        update: true
      environment:
        GIT_SSH_COMMAND: "ssh -i /home/ubuntu/.ssh/github_moviemacabre -o IdentitiesOnly=yes"
      become: false    

    - name: Create MovieMacabre production environment file
      ansible.builtin.copy:
        dest: /home/ubuntu/MovieMacabre/.env
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        content: |
          SECRET_KEY={{ movie_macabre_secret_key }}
          FRONTEND_URL=https://movie-macabre.com
          VITE_API_URL=/api        
      no_log: true       

    - name: Build and start MovieMacabre
      ansible.builtin.command:
        cmd: docker compose up --build -d
        chdir: /home/ubuntu/MovieMacabre
      become: false
      changed_when: false      

    - name: Wait for MovieMacabre HTTPS endpoint
      ansible.builtin.uri:
        url: https://movie-macabre.com
        method: GET
        status_code: 200
        return_content: false
      register: movie_macabre_health
      retries: 12
      delay: 5
      until: movie_macabre_health.status == 200
      delegate_to: localhost
      become: false      