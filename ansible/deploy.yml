---
- name: Configure MovieMacabre server
  hosts: moviemacabre
  become: true

  vars_files:
    - vault.yml

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Install Docker Compose
      ansible.builtin.apt:
        name: docker-compose-v2
        state: present  

    - name: Install Git
      ansible.builtin.apt:
        name: git
        state: present          

    - name: Verify Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      register: docker_compose_version
      changed_when: false

    - name: Show Docker Compose version
      ansible.builtin.debug:
        var: docker_compose_version.stdout            

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to Docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true    

    - name: Create SSH directory for ubuntu
      ansible.builtin.file:
        path: /home/ubuntu/.ssh
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Install GitHub deploy key
      ansible.builtin.copy:
        content: "{{ github_deploy_private_key }}"
        dest: /home/ubuntu/.ssh/github_moviemacabre
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      no_log: true      

    - name: Add GitHub to known hosts
      ansible.builtin.known_hosts:
        name: github.com
        key: "{{ lookup('pipe', 'ssh-keyscan github.com') }}"
        path: /home/ubuntu/.ssh/known_hosts
      become_user: ubuntu      

    - name: Clone or update MovieMacabre repository
      ansible.builtin.git:
        repo: git@github.com:Tocino/MovieMacabre.git
        dest: /home/ubuntu/MovieMacabre
        version: main
        accept_hostkey: true
        update: true
      environment:
        GIT_SSH_COMMAND: "ssh -i /home/ubuntu/.ssh/github_moviemacabre -o IdentitiesOnly=yes"
      become: false    

    - name: Create MovieMacabre production environment file
      ansible.builtin.copy:
        dest: /home/ubuntu/MovieMacabre/.env
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        content: |
          SECRET_KEY={{ movie_macabre_secret_key }}
          FRONTEND_URL=https://movie-macabre.com
          VITE_API_URL=/api        
      no_log: true       

    - name: Build and start MovieMacabre
      ansible.builtin.command:
        cmd: docker compose up --build -d
        chdir: /home/ubuntu/MovieMacabre
      become: false
      changed_when: false      

    - name: Wait for MovieMacabre HTTPS endpoint
      ansible.builtin.uri:
        url: https://movie-macabre.com
        method: GET
        status_code: 200
        return_content: false
      register: movie_macabre_health
      retries: 12
      delay: 5
      until: movie_macabre_health.status == 200
      delegate_to: localhost
      become: false      