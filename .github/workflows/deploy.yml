name: Deploy MovieMacabre

on:
  push:
    branches:
      - main
      
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::384884797289:role/moviemacabre-github-deploy
          aws-region: us-east-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Check EC2 state
        id: ec2
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids "i-075358cc2b0e569df" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "EC2 state: $STATE"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Deploy MovieMacabre through SSM
        if: steps.ec2.outputs.state == 'running'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-075358cc2b0e569df" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo -u ubuntu env GIT_SSH_COMMAND=\"ssh -i /home/ubuntu/.ssh/github_moviemacabre -o IdentitiesOnly=yes -o BatchMode=yes\" git -C /home/ubuntu/MovieMacabre pull --ff-only origin main",
              "cd /home/ubuntu/MovieMacabre && docker compose up --build -d"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-075358cc2b0e569df"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-075358cc2b0e569df"    