name: Deploy MovieMacabre

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

              - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          echo "$TOKEN" \
            | cut -d '.' -f2 \
            | tr '_-' '/+' \
            | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, repository_id, repository_owner, repository_owner_id, ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::384884797289:role/moviemacabre-github-deploy
          aws-region: us-east-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity